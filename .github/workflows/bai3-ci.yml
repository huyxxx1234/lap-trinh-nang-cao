name: Bai 3 - Maven CI & Artifact Upload

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven test and package
        working-directory: Bai3
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload packaged JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bai3-application-jar
          path: Bai3/target/*.jar
          if-no-files-found: error

name: Bai 5 - JaCoCo Coverage Gate (80%)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven verify with JaCoCo check
        working-directory: Bai5
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bai5-jacoco-report
          path: Bai5/target/site/jacoco/
          if-no-files-found: warn

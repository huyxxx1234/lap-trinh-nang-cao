name: Bai 7 - Automated PR Code Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle and Unit Tests
        working-directory: Bai7
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Post Checkstyle Inline Feedback on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passed = '${{ job.status }}' === 'success';
            const reportPath = 'Bai7/target/checkstyle-result.xml';
            const inlineComments = [];

            if (fs.existsSync(reportPath)) {
              const xml = fs.readFileSync(reportPath, 'utf8');
              const fileRegex = /<file name="([^"]+)">([\s\S]*?)<\/file>/g;
              let fileMatch;
              while ((fileMatch = fileRegex.exec(xml)) !== null) {
                const absPath = fileMatch[1].replace(/\\/g, '/');
                const idx = absPath.indexOf('Bai7/');
                const relPath = idx !== -1 ? absPath.substring(idx) : absPath;
                const inner = fileMatch[2];
                const errRegex = /<error line="(\d+)"[^>]*severity="([^"]+)" message="([^"]+)"/g;
                let errMatch;
                while ((errMatch = errRegex.exec(inner)) !== null) {
                  const line = parseInt(errMatch[1], 10);
                  const severity = errMatch[2].toUpperCase();
                  const message = errMatch[3]
                    .replace(/&apos;/g, "'")
                    .replace(/&quot;/g, '"')
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&amp;/g, '&');
                  inlineComments.push({
                    path: relPath,
                    line: line > 0 ? line : 1,
                    body: `**[Checkstyle ${severity}]** ${message}`
                  });
                }
              }
            }

            if (inlineComments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  body: `## Automated Checkstyle Review: FAILED (${inlineComments.length} violation(s) found)`,
                  comments: inlineComments
                });
                return;
              } catch (err) {
                core.warning('Inline review fallback to summary comment: ' + err.message);
              }
            }

            const summary = passed
              ? '## Automated Review: PASSED\n\nAll Checkstyle rules (Google Java Style) and JUnit tests passed.'
              : '## Automated Review: FAILED\n\nCheckstyle or unit tests failed. Please inspect the **quality** job log and fix all reported issues.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
